  - {id: cgiar-sea, name: "CGIAR Asia Tenggara dan Pasifik", url: "https://www.cgiar.org/cgiar-regions/southeast-asia-and-pacific/", tier: riset, lang: en, topics: [pertanian, perikanan-tawar]}
