# Daftar sumber Warta Hayati.
# feed: auto  -> feed dicari otomatis dari halaman 'url' lalu disimpan.
# feed: URL   -> pola URL feed yang diketahui. Alamat eksplisit di bawah sudah diuji
#                dengan `wartahayati check` pada 2026-10-27; rincian kegagalan ada di
#                README bagian keadaan feed dan di halaman status situs.
# include     -> penyaring kata kunci (judul dan ringkasan, tanpa membedakan huruf besar kecil).
# topics      -> topik pertama menentukan tempat sumber tampil di beranda.
# enabled: false + note -> kandidat yang menunggu penilaian redaksi.

defaults:
  max_items: 6

tiers:
  pemerintah: {label: Pemerintah}
  lembaga: {label: Lembaga}
  riset: {label: Riset}
  jurnal: {label: Jurnal}
  preprint: {label: Preprint, note: "Belum melewati telaah sejawat. Perlakukan sebagai petunjuk awal."}
  media: {label: Media}

topics:
  - {slug: pertanian, name: Pertanian}
  - {slug: perkebunan, name: Perkebunan}
  - {slug: perikanan-tawar, name: Perikanan Tawar}
  - {slug: perikanan-laut, name: "Perikanan Payau/Laut"}
  - {slug: kehutanan, name: Kehutanan}
  - {slug: botani, name: Botani}
  - {slug: zoologi, name: Zoologi}
  - {slug: mikrobiologi, name: Mikrobiologi}

sources:
  # Indonesia
  - id: kementan
    name: "Kementerian Pertanian RI"
    url: "https://www.pertanian.go.id/"
    tier: pemerintah
    lang: id
    topics: [pertanian, perkebunan]
    list: {item: "a:has(h4)", title: "h4", date: "time"}
    note: "Tanpa RSS. Berita dan pengumuman dibaca dari halaman depan memakai aturan 'list'."
  - id: kkp
    name: "Kementerian Kelautan dan Perikanan RI"
    url: "https://kkp.go.id/"
    tier: pemerintah
    lang: id
    topics: [perikanan-tawar, perikanan-laut]
    list: {item: "div.main-berita a", title: "div.fw-bolder", date: "div.highlight-news-card-date, div.subhighlight-news-card-date"}
    note: "Tanpa RSS. Daftar berita dibaca dari blok 'INFORMASI TERKINI' di halaman depan memakai aturan 'list'."
  - id: brin-agro
    name: "BRIN (Pertanian dan Perikanan)"
    url: "https://www.brin.go.id/"
    tier: riset
    lang: id
    topics: [pertanian, perikanan-tawar, perikanan-laut, kehutanan]
    include: [pertanian, perikanan, akuakultur, budidaya, hutan, pangan, tanaman, padi, nelayan, agro]
  - id: brin-hayati
    name: "BRIN (Ilmu Hayati)"
    url: "https://www.brin.go.id/"
    tier: riset
    lang: id
    topics: [botani, zoologi, mikrobiologi]
    include: [mikroba, mikrobiologi, bakteri, jamur, fungi, tumbuhan, flora, fauna, satwa, herbarium, biodiversitas, keanekaragaman hayati, taksonomi]
  - {id: mongabay-id, name: "Mongabay Indonesia", url: "https://www.mongabay.co.id/", feed: "https://www.mongabay.co.id/feed/", tier: media, lang: id, topics: [kehutanan, zoologi]}
  - {id: jphka, name: "Jurnal Penelitian Hutan dan Konservasi Alam", url: "https://ejournal.forda-mof.org/ejournal-litbang/index.php/JPHKA", tier: jurnal, lang: id, topics: [kehutanan]}
  - id: kemenhut
    name: "Kementerian Kehutanan RI"
    url: "https://www.kehutanan.go.id/news"
    tier: pemerintah
    lang: id
    topics: [kehutanan]
    list: {item: "div.group", title: "h3", date: "p.text-dark"}
    note: "Tanpa RSS. Daftar berita dibaca dari halaman /news memakai aturan 'list'; domain resmi terverifikasi 2026-10-27."

  # Lembaga dan riset Asia-Pasifik
